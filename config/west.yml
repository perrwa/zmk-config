manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: perrwa
      url-base: https://github.com/perrwa
  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK v0.4 is not tagged yet (latest tag is v0.3.0) — track main to
      # verify the HWMv2 board definitions ahead of the actual release.
      revision: main
      import: app/west.yml
    - name: zmk-component-raytac-dongle
      remote: perrwa
      revision: refs/heads/perrwa/zmk0.4-upgrade
  self:
    path: config
