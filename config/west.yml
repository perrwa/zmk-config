manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: perrwa
      url-base: https://github.com/perrwa
    - name: boardsource
      url-base: https://github.com/boardsource
  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK v0.4 is not tagged yet (latest tag is v0.3.0) — track main to
      # verify the HWMv2 board definitions ahead of the actual release.
      revision: main
      import: app/west.yml
    - name: zmk-component-raytac-dongle
      remote: perrwa
      # Tracks the moving main branch (not the v0.4 tag, which predates the
      # CX-40 board work) — builds on this branch are not reproducible.
      revision: refs/heads/main
    - name: wireless-corne_zmk_config
      remote: boardsource
      # Only consumed for its board files (boards/boardsource/blecorne/,
      # picked up via its own zephyr/module.yml board_root: .) — no
      # `import:`, so its own ZMK pin is irrelevant to us. Tracks its
      # default branch (named `master`, not `main`) since its HWMv2 board
      # format requires ZMK main, same as our own ZMK pin above.
      revision: refs/heads/master
  self:
    path: config
