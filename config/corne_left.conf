# This hardware's own Kconfig.defconfig defaults the left half to
# CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y, assuming the usual two-piece topology
# where the left half is central. In this repo's three-device topology
# the dongle is central instead — both halves are peripherals. This can't
# live in the shared *.conf file: that file loads before this one (per
# ZMK's post_boards_shields.cmake candidate resolution) and would end up
# overriding the dongle shield/board's =y instead.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
