# ZMK's stock corne shield (app/boards/shields/corne/Kconfig.defconfig)
# defaults SHIELD_CORNE_LEFT to CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y, assuming
# the usual two-piece topology where the left half is central. In this
# repo's three-device topology the dongle is central instead — both
# halves are peripherals. This can't live in corne.conf: that file loads
# before this one (per ZMK's post_boards_shields.cmake shield-candidate
# resolution) and would end up overriding corne_dongle.conf's =y instead.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
