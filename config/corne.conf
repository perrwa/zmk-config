CONFIG_PM_DEVICE=y
CONFIG_ZMK_SLEEP=y
# 1800000 ms = 30 minutes (default is 15 min)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Disable RGB underglow and backlight. Neither keyboard sharing this file
# defines a WS2812 or backlight devicetree node, so these are inert no-ops
# on both — kept explicit rather than left to defaults.
#
# (No CONFIG_WS2812_STRIP setting here: under Zephyr 4.1 the bare symbol
# was split into per-bus symbols (WS2812_STRIP_SPI etc.), so setting the
# old name is now a hard Kconfig error rather than a harmless no-op.)
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

CONFIG_ZMK_BATTERY_REPORTING=y

# Disable 2M PHY for better interference resistance near 2.4 GHz devices
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Keymap edits should go through config/*.keymap, not on-device — some
# boards sharing this file ship Studio enabled by default.
CONFIG_ZMK_STUDIO=n
