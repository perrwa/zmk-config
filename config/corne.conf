CONFIG_PM_DEVICE=y
CONFIG_ZMK_SLEEP=y
# 1800000 ms = 30 minutes (default is 15 min)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Disable RGB underglow and backlight to eliminate ~12 mA quiescent draw
# from soldered SMT LEDs (even when "off"). VCC to the LED rail is gated
# via ext_power EP_OFF on the nice!nano v2.
#
# (No CONFIG_WS2812_STRIP setting here: the corne shield's devicetree
# doesn't define a WS2812 node, so the driver was already inert under any
# Zephyr version; under 4.1 the bare symbol was split into per-bus symbols
# (WS2812_STRIP_SPI etc.), so setting the old name is now a hard Kconfig
# error rather than a harmless no-op.)
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

CONFIG_ZMK_BATTERY_REPORTING=y

# Disable 2M PHY for better interference resistance near 2.4 GHz devices
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
