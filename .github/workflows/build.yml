name: Build ZMK firmware
on:
  push:
    branches: [zmk-v0.4]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      # push events need local git history to diff before/after; pull_request
      # events don't (paths-filter queries the GitHub API instead) but the
      # checkout is harmless there too.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Unset (empty) on pull_request keeps the default PR-base diff.
          # paths-filter's own default base on push is the repo's default
          # branch, not "since last push" — on a branch that permanently
          # diverges from main (zmk-v0.4) that means every push reports
          # changed files, defeating the skip. Pass the pre-push SHA
          # explicitly so push events diff their own recent history.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            firmware:
              - 'config/**'
              - 'boards/**'
              - 'build.yaml'
              - 'zephyr/**'
              - '.github/workflows/build.yml'

  build:
    needs: check-changes
    if: always() && (needs.check-changes.outputs.firmware == 'true' || needs.check-changes.result == 'skipped')
    permissions:
      contents: read
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      fallback_binary: hex

  # Gate job that always runs — use this as the required status check
  # instead of internal reusable-workflow jobs that may be skipped.
  build-result:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "Build did not succeed (result: ${{ needs.build.result }})"
            exit 1
          fi
          echo "Build OK (result: ${{ needs.build.result }})"
