---
include:
  - board: nice_nano//zmk
    shield: settings_reset

  - board: mdbt50q_rx
    shield: corne_dongle
  - board: mdbt50q_rx
    shield: settings_reset

  - board: mdbt50q_cx_40
    shield: corne_dongle
  - board: mdbt50q_cx_40
    shield: settings_reset

  # Dongle setup: both halves are peripherals (dongle is central)
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right

  # BLE Corne (blecorne): a second, independent keyboard on the same
  # dongle-central topology. Rides the existing corne_dongle firmware
  # above — same physical layout, same keymap — no dongle build of its own.
  - board: blecorne_left
  - board: blecorne_right
  - board: blecorne_left
    shield: settings_reset
  - board: blecorne_right
    shield: settings_reset
