---
include:
  - board: blecorne_left
    shield: settings_reset
  - board: blecorne_right
    shield: settings_reset

  - board: mdbt50q_cx_40
    shield: corne_dongle
  - board: mdbt50q_cx_40
    shield: settings_reset

  # Dongle setup: both halves are peripherals (dongle is central)
  - board: blecorne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: blecorne_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
